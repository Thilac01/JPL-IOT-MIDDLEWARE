version: "3.8"

services:
  middleware:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jpl-iot-middleware
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - APP_NAME=JPL Security & IoT Middleware
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY}
      - API_KEY=${API_KEY}
      - USE_SSH=${USE_SSH:-true}
      - SSH_HOST=${SSH_HOST:-137.184.15.52}
      - SSH_PORT=${SSH_PORT:-22}
      - SSH_USER=${SSH_USER:-root}
      - SSH_PASSWORD=${SSH_PASSWORD}
      - REPLICA_HOST=${REPLICA_HOST:-127.0.0.1}
      - REPLICA_PORT=${REPLICA_PORT:-3307}
      - REPLICA_USER=${REPLICA_USER:-root}
      - REPLICA_PASSWORD=${REPLICA_PASSWORD}
      - REPLICA_DB=${REPLICA_DB:-koha_library}
      - CDC_ENABLED=${CDC_ENABLED:-true}
      - CDC_USER=${CDC_USER:-root}
      - CDC_PASSWORD=${CDC_PASSWORD}
      - SIMULATION_MODE=${SIMULATION_MODE:-false}
      - AUTO_FALLBACK_SIMULATION=${AUTO_FALLBACK_SIMULATION:-true}
      - SMTP_ENABLED=${SMTP_ENABLED:-false}
      - SMTP_SERVER=${SMTP_SERVER:-smtp-relay.brevo.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL}
    volumes:
      - ./logs:/app/logs
      - ./.cdc_state.json:/app/.cdc_state.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
