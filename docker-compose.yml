version: "3.8"

services:
  middleware:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jpl-iot-middleware
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./.cdc_state.json:/app/.cdc_state.json
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
