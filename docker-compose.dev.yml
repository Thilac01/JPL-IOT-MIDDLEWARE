version: "3.8"

services:
  middleware-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jpl-iot-middleware-dev
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - SIMULATION_MODE=true
    volumes:
      - .:/app
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
